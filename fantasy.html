<!DOCTYPE html>
<html>

<head>
    <title>Action Manga - MangaVerse</title>
    <style>
    *{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial, Helvetica, sans-serif;
   
    background:linear-gradient(to right,#0f0c29,#302b63,#24243e);
    color:white;

}

/* Header */

header{
    background:linear-gradient(to right,#0f0f0f,#1b1b1b,#2d2d2d);
    text-align:center;
    padding:30px;
}

header h1{
    font-size:50px;
    color:#7DD3FC;
}

header p{
    margin-top:15px;
    color:#D1D5DB;
    font-size:20px;
}

/* Navbar */
nav{
    margin-top:25px;
    background:#1B1438;
    padding:18px;
    box-shadow:0 5px 12px rgba(0,0,0,.4);
}

nav a{
    color:white;
    text-decoration:none;
    margin:0 25px;
    font-size:18px;
    font-weight:bold;
    transition:0.3s ease;
}

nav a:hover{
    color:#C084FC;
}


 section {
            padding: 70px;
        }

        section h1 {
            text-align: center;
            margin-bottom: 40px;
            font-size: 35px;
        }



/* Cards */

.cards{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:30px;
}

.card{
    width:250px;
    background:#1E1B4B;
    border-radius:15px;
    overflow:hidden;
    transition:all .35s ease;
    box-shadow:0 5px 12px rgba(0,0,0,.4);
}

.card:hover{
    transform:translateY(-10px) scale(1.03);
    box-shadow:0 0 25px rgba(139,92,246,.6);
}

.card img{
    width:100%;
    height:300px;
    object-fit:cover;
}

.card h3{
    padding:15px 10px 5px;
    text-align:center;
}

.card p{
    padding:0 10px 20px;
    color:#D1D5DB;
    text-align:center;
}

        /* Footer */

footer{
    margin-top: 60px;
    background: #111;
    text-align: center;
    padding: 30px;
    color: #BDBDBD;
}
  /* Popup Background */

        .popup{
            display:none;
            position:fixed;
            inset:0;
            background:rgba(0,0,0,.55);
            backdrop-filter:blur(8px);
            justify-content:center;
            align-items:center;
            z-index:1000;
        }


        /* Popup Box */
        .popup-content{

            width:850px;
            max-width:90%;

            background:#25204F;

            position:relative;

            border-radius:22px;

            padding:35px;

            box-shadow:0 20px 60px rgba(0,0,0,.55);

            animation:popupAnimation .25s ease;

        }

        .popup-layout{
            display:flex;
            gap:30px;
        }

        .left img{
            width:220px;
            border-radius:15px;
        }

        .right{
            flex:1;
        }

        .right h2{
            margin-bottom:15px;
        }

        .right p{
            margin-bottom:10px;
        }
        
        @keyframes popupAnimation{
            from{
                opacity:0;
                transform:scale(.85);
            }
            to{
                opacity:1;
                transform:scale(1);
            }
        }

        /* Close Button */

        .close-btn{
            position:absolute;
            top:15px;
            right:20px;
            font-size:32px;
            color:white;
            cursor:pointer;
            transition:.25s;
        }

        .close-btn:hover{
            color:#C084FC;
            transform:rotate(90deg);
        }

    </style>

</head>

<body>

<header>

        <h1>MangaVerse</h1>

        <p>📖 Find your next favorite manga</p>



        <nav>

            <a href="index.html">Home</a>
            <a href="recommendations.html">Recommendations</a>
            <a href="index.html#genres">Genres</a>
            <a href="toprated.html">Top Rated</a>
            <a href="index.html#contact">Contact</a>

        </nav>
        

    </header>
    
            <section>
                <h1> Fantasy Manga </h1>

            </section>

<div class="cards" id="fantasy-container"></div>


            


            
<footer>

<h3>MangaVerse</h3>

<br>

<p>Made with ❤️ by Priya</p>

<br>

<p>© 2026 MangaVerse. All Rights Reserved.</p>

</footer>
<div class="popup" id="popup">
  <div class="popup-content">
    <span class="close-btn" onclick="closePopup()">&times;</span>
    <div id="popupBody"></div>
  </div>
</div>
<script src="script.js"></script>
<script src="genres.js"></script>
    </body>

</html>
