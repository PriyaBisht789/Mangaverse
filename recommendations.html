    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        html{
            scroll-behavior:smooth;
        }

        body{
            font-family:Arial, Helvetica, sans-serif;
            background:linear-gradient(to right,#0f0c29,#302b63,#24243e);
            color:white;
        }

        header{
            background:linear-gradient(to right,#0f0f0f,#1b1b1b,#2d2d2d);
            text-align:center;
            padding:30px;
        }

        header h1{
            font-size:50px;
            color:#7DD3FC;
        }

        header p{
            margin-top:15px;
            color:#D1D5DB;
            font-size:20px;
        }

        nav{
            margin-top:25px;
            background:#1B1438;
            padding:18px;
            box-shadow:0 5px 12px rgba(0,0,0,.4);
        }

        nav a{
            color:white;
            text-decoration:none;
            margin:0 25px;
            font-size:18px;
            font-weight:bold;
            transition:0.3s ease;
        }

        nav a:hover{
            color:#C084FC;
        }

        section{
            padding:70px;
            text-align:center;
        }

        section h2{
            font-size:35px;
            margin-bottom:20px;
        }

        section p{
            font-size:18px;
            color:#D1D5DB;
            margin-bottom:30px;
        }

        ul{
            list-style:none;
            max-width:500px;
            margin:0 auto;
        }

        ul li{
            background:#1E1B4B;
            padding:15px;
            margin:15px 0;
            border-radius:12px;
            font-size:20px;
            transition:0.3s;
        }

        ul li:hover{
            background:#6D28D9;
            transform:scale(1.03);
        }

        .back-btn{
            display:inline-block;
            margin-top:40px;
            padding:12px 25px;
            background:#8B5CF6;
            color:white;
            text-decoration:none;
            border-radius:30px;
            transition:0.3s;
        }

        .back-btn:hover{
            background:#A855F7;
        }
    </style>
</head>
